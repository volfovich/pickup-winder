; Pickup winder — Teensy 4.0 + TMC2209 (UART config, STEP/DIR motion)

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
monitor_echo = yes
build_flags = -Wall
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    ; TeensyStep4 is experimental — pinned to a reviewed commit
    https://github.com/luni64/TeensyStep4.git#42e1f69450902c7f96d7cd11ab079036adc36d18
    ; Display: frame buffer + async DMA (flicker-free), own Arial fonts — pinned
    https://github.com/KurtE/ILI9341_t3n.git#3e7ed8c88d75a9fa7d376ae9340ee49decf53fb8
; The bundled ILI9341_t3 has fonts with the same names; never build it alongside
lib_ignore = ILI9341_t3
